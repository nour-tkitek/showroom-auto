
<div class="container">
  <label for="brand">Brand</label>

  <input
    id="brand"
    type="text"
    #brand
    (input)="selectAutos(brand.value)"
  >

  <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
</div>

<div class="cars-container">
  @for (auto of selectedAutos; track auto.id) {
    <div class="auto-card">
      <img
        [src]="'images/images/' + auto.photo"
        [alt]="auto.brand + ' ' + auto.model"
      >

      <div class="details">
        <h3>{{ auto.brand }} {{ auto.model }}</h3>

        <p>
          Power: {{ auto.power }}<br>
          Price: ${{ auto.price }}<br>
          Only {{ auto.availability }} units in stock
        </p>
      </div>

      <div class="see_more">
        <button type="button" (click)="selectCar(auto)">
          See More
        </button>

        @if (selectedCar?.id === auto.id) {
          <span class="selected-model">
            {{ auto.model }}
          </span>
        }
      </div>

      @if (selectedCar?.id === auto.id) {
        <div class="description">
          <p>{{ auto.description }}</p>
        </div>
      }
    </div>
  }
</div>
